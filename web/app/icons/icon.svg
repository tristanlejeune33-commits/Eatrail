<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3F8B54"/>
      <stop offset="100%" stop-color="#2D6940"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Stylized leaf-route mark from design brief -->
  <path d="M 256 100
           C 180 100, 130 170, 130 250
           C 130 320, 180 380, 256 412
           C 332 380, 382 320, 382 250
           C 382 170, 332 100, 256 100 Z"
        fill="#F5F7EE" opacity="0.95"/>
  <!-- Center vein/route — winding line -->
  <path d="M 256 130
           Q 220 180, 256 230
           T 256 330
           Q 290 360, 256 390"
        stroke="#3F8B54" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Endpoint dot (start) -->
  <circle cx="256" cy="130" r="14" fill="#D9A441"/>
  <!-- Endpoint dot (end / destination) -->
  <circle cx="256" cy="390" r="14" fill="#C85A3A"/>
</svg>
